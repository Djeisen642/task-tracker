# Bundle the desktop app for Windows, macOS and Linux.
#
# Deliberately separate from ci.yml: a full `tauri build` is minutes of compile
# per platform, so it runs on demand, on release tags, and on pull requests that
# touch the packaging surface — not on every commit to the web layer, which
# ci.yml already covers.
#
# The artifacts are unsigned. That is fine for a direct download, but see
# README's "Installing an unsigned build" for what each OS does about it.
name: Desktop build

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - '.github/workflows/desktop-build.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bundle:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide whether the others bundle.
      fail-fast: false
      matrix:
        include:
          # `universal-apple-darwin` produces one .app/.dmg that runs natively on
          # both Apple Silicon and Intel, which is simpler to hand someone than
          # two downloads they have to choose between.
          - name: macOS (universal)
            os: macos-latest
            args: --target universal-apple-darwin
            bundle: src-tauri/target/universal-apple-darwin/release/bundle
          - name: Linux (deb, rpm, AppImage)
            os: ubuntu-latest
            args: ''
            bundle: src-tauri/target/release/bundle
          - name: Windows (msi, nsis)
            os: windows-latest
            args: ''
            bundle: src-tauri/target/release/bundle
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # WebKitGTK is the webview on Linux, and libayatana-appindicator is what
      # puts the tray icon in the panel. Both are build-time requirements here
      # and runtime requirements on the user's machine (the .deb declares them).
      - name: Install Tauri system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            pkg-config

      # The runner's default toolchain only carries its own architecture; a
      # universal binary needs both halves.
      - name: Add macOS build targets
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Set up pnpm
        uses: pnpm/setup@v2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `tauri build` runs beforeBuildCommand (tsc + vite) first, so the
      # frontend this embeds is built from this commit rather than a stale dist.
      - name: Bundle
        run: pnpm run tauri build ${{ matrix.args }}

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: task-tracker-${{ matrix.os }}
          path: |
            ${{ matrix.bundle }}/**/*.dmg
            ${{ matrix.bundle }}/**/*.deb
            ${{ matrix.bundle }}/**/*.rpm
            ${{ matrix.bundle }}/**/*.AppImage
            ${{ matrix.bundle }}/**/*.msi
            ${{ matrix.bundle }}/**/*.exe
          if-no-files-found: error
          retention-days: 14
