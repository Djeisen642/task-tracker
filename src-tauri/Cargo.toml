[package]
name = "task-tracker"
version = "0.1.0"
description = "Hourly work check-in tracker that journals to plain Markdown"
authors = ["Jason Suttles"]
edition = "2021"
rust-version = "1.77.2"

# The library target is what Tauri's mobile/desktop entry points share.
[lib]
name = "task_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Launch-at-login is desktop-only; the plugin does not build for mobile targets.
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2"

[features]
# This feature is used by the CLI for production builds.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# Optimize hard for the "ultra-lightweight, runs all day" goal.
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
