[package]
name = "task-tracker"
version = "1.0.0"
description = "Hourly work check-in tracker that journals to plain Markdown"
authors = ["Jason Suttles"]
edition = "2021"
rust-version = "1.77.2"

# The library target is what Tauri's mobile/desktop entry points share.
[lib]
name = "task_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` is what makes a transparent window work on macOS: without
# it the card paints on an opaque background there, and `tauri build` refuses
# the `macOSPrivateApi` flag in tauri.conf.json. It is inert on Windows and
# Linux, so it is enabled unconditionally rather than per-target. Note that
# apps using it are not accepted in the Mac App Store — irrelevant here (this
# ships as a direct download), but the reason to keep it deliberate.
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Launch-at-login is desktop-only; the plugin does not build for mobile targets.
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2"

[features]
# This feature is used by the CLI for production builds.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# Optimize hard for the "ultra-lightweight, runs all day" goal.
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
