<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
  role="img" aria-label="Task Tracker">
  <title>Task Tracker</title>
  <desc>A checkmark inside a clock dial: the hourly check-in.</desc>

  <defs>
    <!--
      userSpaceOnUse throughout. An objectBoundingBox gradient collapses on any
      shape with a zero-width or zero-height bounding box (a perfectly vertical
      or horizontal stroked line), which silently renders the stroke black —
      a trap the sibling project hit while rasterizing its icon.
    -->
    <linearGradient id="tile" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2b3555" />
      <stop offset="1" stop-color="#12141b" />
    </linearGradient>

    <linearGradient id="dial" x1="116" y1="106" x2="396" y2="386" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8fb0ff" />
      <stop offset="1" stop-color="#4f7cf0" />
    </linearGradient>

    <linearGradient id="tick" x1="196" y1="180" x2="330" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7ee6a4" />
      <stop offset="1" stop-color="#42c07d" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#tile)" />

  <!-- A soft inner highlight so the tile doesn't read as flat on dark themes. -->
  <rect x="6" y="6" width="500" height="500" rx="108" fill="none"
    stroke="#ffffff" stroke-opacity="0.07" stroke-width="3" />

  <!--
    The dial, with a deliberate break at 12 o'clock for the hour pip to sit in.
    The circumference is 2π·146 ≈ 917, so an 820/97 dash leaves the gap spanning
    the last 38° of the sweep; rotating by -71° carries that gap to the top.
    Getting this angle wrong reads as a rendering artifact rather than a design.
  -->
  <circle cx="256" cy="262" r="146" fill="none" stroke="url(#dial)" stroke-width="34"
    stroke-linecap="round" stroke-dasharray="820 97" transform="rotate(-71 256 262)" />

  <!-- Hour pip: the same amber the card uses for work in progress. -->
  <circle cx="256" cy="116" r="31" fill="#f5c451" />

  <!--
    The check. Drawn twice: a tile-colored stroke underneath separates it from
    the dial without needing a mask, which keeps every rasterizer honest.
  -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M182 266 L238 324 L342 196" stroke="#12141b" stroke-width="86" stroke-opacity="0.95" />
    <path d="M182 266 L238 324 L342 196" stroke="url(#tick)" stroke-width="46" />
  </g>
</svg>
