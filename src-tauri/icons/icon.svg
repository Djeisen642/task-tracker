<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Task Tracker">
  <title>Task Tracker</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a3350" />
      <stop offset="1" stop-color="#141821" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7aa2ff" />
      <stop offset="1" stop-color="#5b86f5" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Three task rows: done, in progress, upcoming — the app's whole model. -->
  <g transform="translate(112 136)">
    <rect width="64" height="64" rx="18" fill="url(#accent)" />
    <path d="M18 33l11 11 21-23" fill="none" stroke="#101319" stroke-width="9"
      stroke-linecap="round" stroke-linejoin="round" />
    <rect x="92" y="20" width="196" height="24" rx="12" fill="#7c8598" />
  </g>

  <g transform="translate(112 240)">
    <rect width="64" height="64" rx="18" fill="#f5c451" />
    <circle cx="32" cy="32" r="11" fill="#101319" />
    <rect x="92" y="20" width="164" height="24" rx="12" fill="#aab3c4" />
  </g>

  <g transform="translate(112 344)">
    <rect width="64" height="64" rx="18" fill="none" stroke="#6f7684" stroke-width="8" />
    <rect x="92" y="20" width="128" height="24" rx="12" fill="#6f7684" />
  </g>
</svg>
